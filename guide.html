<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Área de grabación</title>
    <!--
      Guía del área que se va a grabar: atenúa todo el escritorio menos la
      región elegida.

      No usa el bundle de la app ni la API de Tauri: recibe todo por query
      params y se dibuja sola. Sin IPC no necesita capability, y sin
      dependencias no hay mucho que pueda romperse.

      La ventana cubre el escritorio virtual completo y es click-through.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      /*
        `outline` y no `border`: se dibuja POR FUERA de la caja, así el marco
        cyan no entra en la grabación. Con border quedaría 2px adentro y
        aparecería en el video.

        El box-shadow gigante atenúa todo lo de afuera sin necesidad de cuatro
        divs recortando los bordes.
      */
      .hole {
        position: fixed;
        outline: 2px solid #35d6e8;
        box-shadow: 0 0 0 100vmax rgb(7 9 12 / 0.45);
      }
    </style>
  </head>
  <body>
    <div class="hole" id="hole"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const num = (clave) => Number(params.get(clave) ?? 0);
      const hole = document.getElementById("hole");

      function pintar() {
        const anchoFisico = num("dw");
        if (anchoFisico <= 0 || window.innerWidth <= 0) return;

        // El escalado sale de comparar el ancho físico contra el CSS: así queda
        // bien con cualquier zoom del sistema, sin leer devicePixelRatio.
        const escala = anchoFisico / window.innerWidth;

        // La región llega en coordenadas del escritorio virtual, que puede
        // arrancar en negativo. Se pasa a coordenadas de esta ventana.
        hole.style.left = `${(num("x") - num("dx")) / escala}px`;
        hole.style.top = `${(num("y") - num("dy")) / escala}px`;
        hole.style.width = `${num("w") / escala}px`;
        hole.style.height = `${num("h") / escala}px`;
      }

      // Se repinta en cada resize, y no solo al cargar: la ventana se crea con
      // el tamaño por defecto y se agranda al escritorio DESPUÉS. Calcular una
      // sola vez deja la escala tomada del tamaño equivocado, y el marco
      // aparece en cualquier lado.
      pintar();
      window.addEventListener("resize", pintar);
    </script>
  </body>
</html>
